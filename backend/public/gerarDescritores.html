<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Gerar Descritores Faciais</title>

    <!-- 🤖 Biblioteca para reconhecimento facial -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

    <!-- 🎨 Estilo visual básico -->
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 2rem;
        text-align: center;
        background-color: #f7f7f7;
      }
      input,
      button {
        margin: 10px;
        padding: 0.6rem;
        font-size: 1rem;
      }
      pre {
        background-color: #eee;
        padding: 1rem;
        max-height: 300px;
        overflow: auto;
        text-align: left;
      }
      a {
        margin-top: 1rem;
        display: inline-block;
        font-weight: bold;
        color: #2b6cb0;
      }
    </style>
  </head>

  <body>
    <h1>🧠 Gerador de Descritores Faciais</h1>

    <!-- 📁 Input para escolher imagens -->
    <input type="file" id="inputImagens" multiple accept="image/*" />
    <br />

    <!-- ▶️ Botão de ação -->
    <button onclick="gerarDescritores()">Gerar Descritores</button>

    <!-- 🧾 Resultado em JSON -->
    <pre id="saida"></pre>

    <!-- 🔗 Link para download do JSON -->
    <a id="downloadLink" style="display: none;"></a>

    <script>
      // 📦 Carrega os modelos da IA
      async function carregarModelos() {
        const URL = '/models';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(URL),
        ]);
        console.log('✅ Modelos carregados');
      }

      // 🧠 Geração dos descritores faciais
      async function gerarDescritores() {
        const entrada = document.getElementById('inputImagens');
        const resultados = [];

        for (const arquivo of entrada.files) {
          const img = await carregarImagem(arquivo);

          const deteccao = await faceapi
            .detectSingleFace(img)
            .withFaceLandmarks()
            .withFaceDescriptor();

          if (!deteccao) {
            alert(`⚠️ Nenhuma face detectada em ${arquivo.name}`);
            continue;
          }

          const nome = arquivo.name.split('.')[0];
          resultados.push({
            nome,
            descritores: [Array.from(deteccao.descriptor)],
          });
        }

        const json = JSON.stringify(resultados, null, 2);
        document.getElementById('saida').textContent = json;

        const blob = new Blob([json], { type: 'application/json' });
        const link = document.getElementById('downloadLink');
        link.href = URL.createObjectURL(blob);
        link.download = 'descriptors.json';
        link.textContent = '📥 Baixar descriptors.json';
        link.style.display = 'inline-block';
      }

      // 📸 Carrega a imagem e resolve como objeto <img>
      function carregarImagem(arquivo) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = URL.createObjectURL(arquivo);
        });
      }

      // 🚀 Inicia o carregamento dos modelos assim que a página abre
      carregarModelos();
    </script>
  </body>
</html>
